
name: Zepto Cloud Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Zepto project files..."

          test -s README.md
          test -s source-pc.js
          test -s source-mobile.js
          test -s zepto-pc.js
          test -s zepto-mobile.js

          echo "All project files verified successfully!"
